ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO0_IN
  phy_addr: 1
  power_pin: GPIO16
  # Optional manual IP
  manual_ip:
    static_ip: "${ip}"
    gateway: "${gateway}"
    subnet: "${subnet}"

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "${upper_devicename} - IP Address"
    mac_address:
      name: "${upper_devicename} - MAC Address"
